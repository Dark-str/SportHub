ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    <Directory /var/www/html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    # Route only the public API entry point. Core, config and SQL are outside
    # DocumentRoot, and real endpoint directories never cause slash redirects.
    AliasMatch "^/api(?:/.*)?$" "/opt/sporthub/backend/index.php"
    <Directory /opt/sporthub/backend>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
